name: imgrsz

services:
  imgrsz:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: imgrsz:latest
    restart: unless-stopped
    env_file: ../credentials.env
    volumes:
      - ../data:/data
      - /root/backups:/backups
      - www-stats:/srv/www
    networks:
      edge-imgrsz:
        aliases:
          - imgrsz
    mem_limit: 512m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  www-stats:
    external: true
    name: deploy_www-stats

networks:
  edge-imgrsz:
    external: true
